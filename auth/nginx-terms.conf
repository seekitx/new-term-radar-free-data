server {
    listen 80;
    server_name terms.aifluxor.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name terms.aifluxor.com;
    ssl_certificate /etc/letsencrypt/live/terms.aifluxor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/terms.aifluxor.com/privkey.pem;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    resolver 127.0.0.11 valid=30s;
    set $radar_origin new-term-radar-site:80;
    set $radar_auth new-term-radar-auth:8080;
    location = /__radar_auth_check {
        internal;
        proxy_pass http://$radar_auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location = /login {
        client_max_body_size 4k;
        proxy_pass http://$radar_auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    location = /logout {
        proxy_pass http://$radar_auth/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }
    location @radar_unauthenticated {
        return 302 /login;
    }
    location / {
        auth_request /__radar_auth_check;
        error_page 401 = @radar_unauthenticated;
        add_header Cache-Control "private, no-store" always;
        proxy_pass http://$radar_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
