name: 每日免费新词采集
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
concurrency:
  group: free-radar
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 恢复来源快照
        uses: actions/cache/restore@v4
        with:
          path: state
          key: free-radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: free-radar-state-
      - name: 抓取免费来源
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AISA_API_KEY: ''
          GOANYAPI_API_KEY: ''
          TRUSTMRR_API_KEY: ''
        run: python run_free.py
      - name: 保存来源快照
        uses: actions/cache/save@v4
        with:
          path: state
          key: free-radar-state-${{ github.run_id }}-${{ github.run_attempt }}
      - name: 发布本次公开报告
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/latest.json
          if ! git diff --cached --quiet; then
            git commit -m '更新免费来源日报'
            git push
          fi
